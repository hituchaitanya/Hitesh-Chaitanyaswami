seed: 42
device: cuda

data:
  synth_dir: data/synth
  cid_dir: data/CID
  frsd_dir: data/FRSD
  batch_size: 8
  num_workers: 4
  img_size: [512,256]   # H,W (adjustable)

preproc:
  clahe_clip: 2.0
  clahe_tile: [8,8]
  median_ksize: 3

seg:
  in_channels: 1
  out_channels: 1
  base: 32

edge:
  sobel_k: 3
  lambda_r: 0.8
  iterations: 1
  threshold: 30

inpaint:
  patch_size: 9
  search_radius: 30

rec:
  img_h: 32
  nclass: 80
  nh: 256

clf:
  n_classes: 2
  lr: 1e-3
  epochs: 40
  save_every: 5
  checkpoint_dir: weights
